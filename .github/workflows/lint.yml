name: lint

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Instalar dependencias
        run: |
          pip install -r requirements.txt
          pip install ruff
      - name: Verificar sintaxis
        run: python -m py_compile src/pump_scanner.py
      - name: Ruff
        run: ruff check src/ --select E9,F63,F7,F82
